<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">mercha — sıfırdan kurarım, fazlasını silerim.</title>
  <desc id="bannerDesc">mercha kişisel profil bannerı: web, macOS ve otomasyon.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0D12"/>
      <stop offset="1" stop-color="#10141C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1080 20) rotate(90) scale(420 560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" stop-opacity=".14"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1279" height="319" rx="23.5" stroke="#FFFFFF" stroke-opacity=".08"/>

  <text x="80" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="4" fill="#F59E0B">// MERCHA</text>

  <text x="76" y="194" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="96" font-weight="700" letter-spacing="-4" fill="#F5F7FA">mercha</text>
  <rect x="390" y="120" width="7" height="70" rx="2" fill="#F59E0B">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="80" y="242" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="25" fill="#A8B2C1">Sıfırdan kurarım, fazlasını silerim.</text>

  <text x="80" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#7D8797">WEB · MACOS · OTOMASYON</text>

  <g transform="translate(920 60)">
    <rect width="280" height="200" rx="18" fill="#0D1117" stroke="#FFFFFF" stroke-opacity=".09"/>
    <path d="M0 30V18A18 18 0 0 1 18 0h12" stroke="#F59E0B" stroke-opacity=".7" stroke-width="2"/>
    <path d="M280 170v12a18 18 0 0 1-18 18h-12" stroke="#F59E0B" stroke-opacity=".7" stroke-width="2"/>

    <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#6E7989">PROFILE / 001</text>
    <text x="24" y="140" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="92" font-weight="700" letter-spacing="-5" fill="url(#amber)">m3</text>

    <path d="M184 64v96" stroke="#FFFFFF" stroke-opacity=".07"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.6" fill="#66707F" text-anchor="end">
      <text x="252" y="98">WEB</text>
      <text x="252" y="116">MACOS</text>
      <text x="252" y="134">OTOMASYON</text>
    </g>

    <path d="M28 166h224" stroke="#FFFFFF" stroke-opacity=".08"/>
    <circle cx="31" cy="186" r="3" fill="#F59E0B"/>
    <text x="42" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#8B96A6">TÜRKİYE · SINCE 2023</text>
  </g>
</svg>
